schema_version: "1.0"
proposal_id: "SCP-2026-001-gfc2020-post2020-deforestation-evidence"
created_at: "2026-07-04"
status: "DRAFT"
view: "dao_stakeholders"
stakeholder_confirmation: false

title: "Add dynamically versioned GFC2020-based post-2020 deforestation evidence layer to the EUDR Digital Twin"
summary: |
  The current Digital Twin needs a clear, inspectable method for estimating whether post-2020 forest disturbance occurred inside land that was forest at the EUDR cut-off date. GFC2020 provides a harmonised 2020 forest baseline, but by itself it does not detect post-2020 disturbance or prove agricultural conversion.

  This proposal asks the DAO to approve a new evidence layer that combines GFC2020 with post-2020 change datasets while preserving evidence gaps, dataset conflicts, and dataset-version metadata. Because source datasets are updated over time, the evidence period must be resolved dynamically from dataset availability rather than hard-coded.

  The Digital Twin must not assert EUDR compliance or non-compliance. It should support auditable evidence review, human review, and DAO governance decisions.

scope:
  affected_areas:
    - "dao_governance"
    - "reports"
    - "evidence_model"
    - "dependencies"
    - "static_publication"
  affected_stage:
    - "evidence_acquisition"
    - "validation"
    - "reporting"
    - "governance_review"

claims:
  - text: "GFC2020 can be proposed as a public, inspectable 2020 forest-baseline evidence layer for Digital Twin examples, while remaining non-authoritative for legal determinations."
    grounded_in:
      - "docs/regulation/policy_to_evidence_spine.md"
      - "docs/dao/proposal_schema.md"
    assumption: false
  - text: "Post-2020 disturbance evidence must be represented separately from agricultural-conversion evidence."
    grounded_in:
      - "docs/regulation/policy_to_evidence_spine.md"
      - "scripts/aoi_report_renderer.py"
    assumption: false
  - text: "Dataset versions, temporal coverage, latest available year, and used-through year must be recorded so static reports remain reproducible and inspectable."
    grounded_in:
      - "docs/regulation/policy_to_evidence_spine.md"
      - "docs/site/bundles/runs/example/estonia_aoi_report.json"
    assumption: false
  - text: "The latest available evidence year may lag the current calendar year and should be resolved from dataset availability unless explicitly pinned."
    grounded_in:
      - "docs/regulation/policy_to_evidence_spine.md"
      - "README.md"
    assumption: false

dao_stakeholders:
  questions:
    - "Should JRC GFC2020 be accepted as a default public 2020 forest-baseline evidence layer for Digital Twin examples?"
    - "How should reports communicate that GFC2020 is informative but not legally binding?"
    - "What minimum evidence should be required before post-2020 disturbance is interpreted as possible EUDR-relevant deforestation?"
    - "Should agricultural-conversion evidence be mandatory before a report can move beyond \"disturbance detected\"?"
    - "How should dataset disagreement between Hansen, TMF, RADD, Sentinel confirmation, and national layers be represented?"
    - "What thresholds should trigger human review?"
    - "Should the Digital Twin expose \"evidence gap\" and \"conflict register\" entries as first-class report objects?"
    - "Should the default evidence period use the latest available complete evidence year?"
    - "Should users be allowed to pin an older evidence end year for reproducibility?"
    - "How should reports communicate that the latest evidence year may lag the current calendar year?"

dao_developers:
  tasks:
    - "Add GFC2020 baseline metrics to AOI evidence bundles."
    - "Add Hansen post-2020 loss metrics inside the GFC2020 forest mask."
    - "Add optional JRC TMF deforestation/degradation metrics where geographically applicable."
    - "Add optional RADD confirmed and low-confidence alert metrics where geographically applicable."
    - "Add optional Sentinel-1/2 local confirmation indices."
    - "Add agricultural-conversion evidence fields, initially nullable."
    - "Add deterministic decision-rule outputs that classify evidence state without asserting legal compliance."
    - "Add a dataset registry that records dataset asset IDs, versions, temporal coverage, latest available year, and update policy."
    - "Implement `--end-year auto` so the system resolves the latest available complete evidence year dynamically."
    - "Implement explicit end-year pinning for reproducibility."
    - "Update report templates, JSON schemas, documentation, and tests."
    - "Add conflict-register support for disagreement among evidence layers."
    - "Add acceptance tests using public example AOIs only."

evidence_model:
  baseline_forest:
    dataset: "JRC/GFC2020/V3"
    role: "forest_baseline_2020"
    aoi_area_ha: 0.0
    forest_area_ha: 0.0
    forest_share: 0.0
  evidence_period:
    start_year: 2021
    requested_end_year: "auto"
    resolved_end_year: 2025
    end_year_resolution_mode: "auto_latest_available_complete_evidence_year"
    notice: "The resolved end year reflects dataset availability, not necessarily the current calendar year."
  dataset_versions:
    hansen_gfc:
      asset_id: "UMD/hansen/global_forest_change_2025_v1_13"
      latest_available_year: 2025
      used_through_year: 2025
      update_policy: "annual_release"
    jrc_tmf:
      asset_id: "projects/JRC/TMF/v1_2025"
      latest_available_year: 2025
      used_through_year: 2025
      update_policy: "annual_release"
  post2020_disturbance:
    hansen_loss_ha: 0.0
    tmf_deforestation_ha: null
    tmf_degradation_ha: null
    radd_confirmed_alert_ha: null
    radd_low_confidence_alert_ha: null
    sentinel_confirmation: null
    union_candidate_disturbance_ha: 0.0
  metrics_by_year:
    hansen_loss_inside_gfc2020_ha:
      "2021": 0.0
      "2022": 0.0
      "2023": 0.0
      "2024": 0.0
      "2025": 0.0
  agricultural_conversion:
    evidence_present: false
    source: null
    commodity: null
    confidence: null
  evidence_state:
    post2020_disturbance_detected: false
    possible_eudr_relevant_deforestation: "not_assessed"
    human_review_required: true
    evidence_gap:
      - "agricultural_conversion_evidence_missing"
    conflict_register: []

proposed_evidence_states:
  - "no_2020_forest_baseline_detected"
  - "no_post2020_disturbance_detected"
  - "post2020_disturbance_detected_conversion_unknown"
  - "post2020_disturbance_detected_conversion_supported"
  - "conflicting_evidence"
  - "insufficient_evidence"
  - "human_review_required"
  - "temporal_coverage_gap"

acceptance_criteria:
  - "Reports expose GFC2020 baseline forest area and post-2020 disturbance metrics."
  - "Disturbance is computed only for years 2021 and later."
  - "Disturbance is intersected with the 2020 forest baseline."
  - "The evidence end year is dynamically resolved from dataset availability unless explicitly pinned."
  - "Reports record the requested end year, resolved end year, per-layer latest available year, and per-layer used-through year."
  - "Agricultural-conversion evidence is represented separately."
  - "The system does not assert EUDR compliance or non-compliance."
  - "Dataset disagreement is preserved in a conflict register."
  - "Missing conversion evidence is displayed as an evidence gap."
  - "Dataset temporal-coverage gaps are displayed as evidence gaps or warnings."
  - "The output is deterministic, inspectable, and suitable for static publication in the Digital Twin portal."
  - "Private AOI-specific data is not published in public examples."
  - "Human review is triggered for non-negligible disturbance, missing conversion evidence, conflicting datasets, or temporal-coverage gaps."

limitations:
  - "GFC2020 is a baseline evidence layer, not legal authority."
  - "Hansen, TMF, RADD, and Sentinel layers estimate disturbance, degradation, or alerts; they do not by themselves prove agricultural conversion."
  - "The latest available evidence year may lag the current calendar year."
  - "Dataset versions and temporal coverage must be recorded for reproducibility."
  - "National data, permits, land-use records, supply-chain evidence, and high-resolution imagery may be needed for final review."
  - "The Digital Twin supports auditable evidence review and DAO governance; it does not make compliance decisions."

evidence_refs:
  - path: "docs/regulation/policy_to_evidence_spine.md"
    reason: "Maps EUDR policy concepts to Digital Twin evidence and reporting semantics."
  - path: "README.md"
    reason: "Documents the public Digital Twin portal and report-generation behavior."
  - path: "scripts/aoi_report_renderer.py"
    reason: "Renders AOI evidence reports and should expose the proposed evidence-state fields."
  - path: "docs/site/bundles/runs/example/estonia_aoi_report.json"
    reason: "Public example AOI report bundle suitable for acceptance testing without publishing private AOI-specific data."

evidence_gaps:
  - "DAO stakeholder confirmation is required before this proposal can move from DRAFT."
  - "Human-review thresholds for non-negligible disturbance are not yet approved."
  - "Agricultural-conversion source requirements and confidence thresholds are not yet approved."
  - "Per-layer geographic applicability rules for TMF, RADD, Sentinel confirmation, and national layers require implementation-level documentation."

proposed_changes:
  - target_repo: "eudr-dmi-gil"
    target_path: "src/eudr/evidence/"
    change_summary: "Add deterministic dataset registry, baseline masking, post-2020 disturbance metrics, decision-rule outputs, evidence gaps, and conflict-register support."
  - target_repo: "eudr-dmi-gil"
    target_path: "data_db/"
    change_summary: "Record GFC2020, Hansen, TMF, RADD, Sentinel, and agricultural-conversion evidence dependencies, versions, temporal coverage, and update policies."
  - target_repo: "eudr-dmi-gil"
    target_path: "tests/"
    change_summary: "Add acceptance tests for dynamic end-year resolution, explicit end-year pinning, conversion-evidence separation, conflict handling, and public example AOIs."
  - target_repo: "eudr-dmi-gil-digital-twin"
    target_path: "scripts/aoi_report_renderer.py"
    change_summary: "Render GFC2020 baseline, dynamically resolved evidence period, dataset temporal coverage, evidence gaps, and conflict register without compliance assertions."
  - target_repo: "eudr-dmi-gil-digital-twin"
    target_path: "docs/site/bundles/runs/"
    change_summary: "Publish only public example AOI evidence bundles containing non-private evidence fields and reproducibility metadata."
  - target_repo: "eudr-dmi-gil-digital-twin"
    target_path: "docs/regulation/policy_to_evidence_spine.md"
    change_summary: "Document the evidence semantics, limitations, and non-decision status of post-2020 disturbance indicators."

review_notes: |
  Reviewers should confirm that the proposal preserves a strict distinction between forest-baseline evidence, post-2020 disturbance evidence, agricultural-conversion evidence, and legal conclusions. The proposal is acceptable only if generated reports remain deterministic, inspectable, statically publishable, and explicit that the Digital Twin does not assert EUDR compliance or non-compliance.
