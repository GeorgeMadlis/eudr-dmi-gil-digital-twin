name: Publish AI-safe mirror

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-ai-mirror
  cancel-in-progress: true

jobs:
  publish-ai-mirror:
    runs-on: ubuntu-latest
    env:
      MIRROR_REPO: georgemadlis/eudr-dmi-gil-digital-twin-ai-mirror
      MIRROR_BRANCH: main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Digital Twin static bundle
        run: |
          set -euxo pipefail
          python3 scripts/render_dte_instructions.py --site-root docs/site
          python3 scripts/rebuild_aoi_reports_index.py --site-root docs/site
          bash scripts/check_links_local.sh --site-root docs/site
          test -d docs/site

      - name: Prepare mirror payload
        run: |
          set -euxo pipefail
          rm -rf mirror_root
          mkdir -p mirror_root/site
          rsync -a --delete docs/site/ mirror_root/site/
          touch mirror_root/.nojekyll
          cat > mirror_root/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=site/index.html" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Digital Twin AI Mirror</title>
              <style>
                body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 24px; }
                a { color: #0b5fff; }
                code { background:#f1f1f1; padding:1px 4px; border-radius:6px; }
              </style>
            </head>
            <body>
              <h1>Digital Twin AI Mirror</h1>
              <p>Redirecting to <a href="site/index.html">site/index.html</a>...</p>
              <p>If redirects are blocked, open <code>site/index.html</code>.</p>
            </body>
          </html>
          EOF
          cat > mirror_root/README.md <<'EOF'
          # eudr-dmi-gil-digital-twin-ai-mirror

          This repository is a static mirror of the Digital Twin publish bundle.

          Browser entrypoints:

          - Home: https://georgemadlis.github.io/eudr-dmi-gil-digital-twin-ai-mirror/site/index.html
          - AOI reports index: https://georgemadlis.github.io/eudr-dmi-gil-digital-twin-ai-mirror/site/aoi_reports/index.html
          - Example AOI run bundle: https://georgemadlis.github.io/eudr-dmi-gil-digital-twin-ai-mirror/site/aoi_reports/runs/example/report.html

          Do not use `github.com/.../tree/...` paths as website URLs; browse the Pages URLs above instead.
          EOF

      - name: Force-push mirror payload to ai-mirror repo
        env:
          AI_MIRROR_PUSH_TOKEN: ${{ secrets.AI_MIRROR_PUSH_TOKEN }}
        run: |
          set -euxo pipefail
          if [ -z "${AI_MIRROR_PUSH_TOKEN}" ]; then
            echo "AI_MIRROR_PUSH_TOKEN is required" >&2
            exit 2
          fi

          cd mirror_root
          git init
          git checkout -B "${MIRROR_BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish AI-safe mirror (${GITHUB_SHA})" || echo "No changes to commit"
          git remote add origin "https://x-access-token:${AI_MIRROR_PUSH_TOKEN}@github.com/${MIRROR_REPO}.git"
          git push --force origin "${MIRROR_BRANCH}"
